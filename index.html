<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>눈치게임</title>
  <style>
[hidden] {
  display: none !important;
}

body {
  background: #060309;
  color: #f7ebf1;
  text-align: center;
  font-family: sans-serif;
}

h1 {
  margin: 20px 0 10px;
}

#lobbyBox,
#roomBox {
  max-width: 320px;
  margin: 0 auto;
  padding: 0 16px;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 6px 0;
  font-size: 18px;
  text-align: center;
  color: #f7ebf1;
  background: #150b14;
  border: 2px solid #ff4f9a;
  border-radius: 12px;
}

button {
  padding: 12px 28px;
  margin: 8px 0;
  font-size: 18px;
  color: #060309;
  background: #ff4f9a;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}

.or {
  margin: 20px 0 6px;
  opacity: 0.7;
}

#lobbyMsg {
  min-height: 24px;
  color: #ff9ac8;
}

#pinShow {
  display: block;
  font-size: 48px;
  font-weight: bold;
  letter-spacing: 8px;
  color: #ff4f9a;
}

#playerList {
  padding: 0;
  font-size: 20px;
  list-style: none;
}

#field {
  position: fixed;
  inset: 0;
}

.num {
  position: absolute;
  border-radius: 50%;
  background: #ff4f9a;
  color: #060309;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
}

.done {
  opacity: 0.2;
}

#over {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(6, 3, 9, 0.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
}

#rabbit {
  width: 128px;
  height: 192px;
  image-rendering: pixelated;
}

#msg {
  font-size: 22px;
  margin: 16px 0 8px;
}

#dare {
  color: #ff4f9a;
  font-size: 20px;
  margin: 8px 0 20px;
}

  </style>
</head>
<body>
  <h1>눈치게임</h1>

  <div id="lobbyBox">
    <input id="nameInput" placeholder="Your nickname" maxlength="10">
    <button id="newBtn">New game</button>
    <p class="or">or join a friend's game</p>
    <input id="pinInput" placeholder="4-digit PIN" inputmode="numeric" maxlength="4">
    <button id="joinBtn">Join</button>
    <p id="lobbyMsg">Loading...</p>
  </div>

  <div id="roomBox" hidden>
    <p>Game PIN</p>
    <span id="pinShow"></span>
    <p>Players</p>
    <ul id="playerList"></ul>
    <button id="startBtn" hidden>Start game</button>
    <p id="roomMsg"></p>
    <p id="waitHost" hidden>Waiting for the host to start...</p>
  </div>

  <div id="gameBox" hidden>
    <p id="info">Tap 1 first!</p>
    <div id="field"></div>
  </div>

  <div id="over" hidden>
    <img id="rabbit" alt="rabbit">
    <p id="msg"></p>
    <p id="dare"></p>
    <button id="again">Play again</button>
    <p id="waitNext" hidden>Waiting for the host...</p>
  </div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, set, update, push, get, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAjeYitx3Uv_BalfQpx2nuDiIMRRln2ga0",
  authDomain: "nunchi-game-test-d2500.firebaseapp.com",
  databaseURL: "https://nunchi-game-test-d2500-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "nunchi-game-test-d2500",
  storageBucket: "nunchi-game-test-d2500.firebasestorage.app",
  messagingSenderId: "122509816",
  appId: "1:122509816:web:4e4fe122671ee6529c9e0d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const RABBIT = "iVBORw0KGgoAAAANSUhEUgAAACAAAAAwCAYAAABwrHhvAAAB10lEQVR42u2XvU4CQRDHZze8gAmd9Ech0YpGSgsjjQWx2geQQIeFdnZYaCfRB6CksNFQWGJjJZECe6kw8RHWxiN7x+7tzLCAJkyyudztx/+3MzuzOYCNbWxjBNONOx16TUkVDw0hOTsPCSHXHSIawO1p8BBJsrgFYib620eBCBeCDMBwAM17Vv/DntLmkwcQL+6C8PWvIgvWnoZ/FuD4rSvM58oBwhzCJXkgh8/zmnHie/PFJtUftL5rPaW3EBcWW5wAITMvF9OtrPJc413d8c4vyw3r09Wc4zMghGvnxWLVOmE8frR+945v9kB06oId8+lJVUdRGR1/63iLJ9B1oDKcksKIHY+uA3OuN3PdclhdocIDPL0m34/K+O0T5roBfIJZKUqATZwB0amLoGU0FTJvFmArIAAk2lLKchaEKeoFWOROcEGgPbDWCwkpjjoUrUjp64N9NPTZ8wvcfHRFEIBWpPQoX5i9d7ffAQDgargFAADnu98AAKAmpcS8na9PFISkiFNslC9AK1Ka7QGfeOyJ9M7T5vOE5IqrSQnUpDQD4XpCcsVjWxRCLiIeAoL0X2CK9wdt6A/a1j6K5XwHyOWRw8oFSiBrjf/9c5oOAddy3InYEPjsB6Su0Nexc+J5AAAAAElFTkSuQmCC";
const CLASH_MS = 600;
const MAX_PLAYERS = 12;
const DARES = [
  "Do your best rabbit impression!",
  "Say 'I am a slow turtle' in a cute voice!",
  "Give a compliment to the person on your left!",
  "Do 10 squats!",
  "Talk like a news reporter for 30 seconds!",
  "Do a dance for 10 seconds!"
];

function $(id) {
  return document.getElementById(id);
}

const lobbyBox = $("lobbyBox");
const roomBox = $("roomBox");
const gameBox = $("gameBox");
const nameInput = $("nameInput");
const pinInput = $("pinInput");
const lobbyMsg = $("lobbyMsg");
const pinShow = $("pinShow");
const playerList = $("playerList");
const startBtn = $("startBtn");
const waitHost = $("waitHost");
const roomMsg = $("roomMsg");
const info = $("info");
const field = $("field");
const over = $("over");
const rabbit = $("rabbit");
const msg = $("msg");
const dareText = $("dare");
const again = $("again");
const waitNext = $("waitNext");

rabbit.src = "data:image/png;base64," + RABBIT;

const myId = "p" + Math.random().toString(36).slice(2, 8);
let myName = "";
let pin = "";
let isHost = false;
let currentRound = 0;
let overShown = false;
let circles = 1;
let playerCount = 0;
let latest = { next: 1, last: null, over: false, finished: false, losers: [], used: {}, leftover: "" };
const placed = [];

/* ---------- lobby ---------- */

async function newGame() {
  myName = nameInput.value.trim() || "Player";
  lobbyMsg.textContent = "Creating...";
  try {
    for (let tries = 0; tries < 10; tries++) {
      const candidate = String(Math.floor(1000 + Math.random() * 9000));
      const snap = await get(ref(db, "rooms/" + candidate));
      if (!snap.exists()) {
        pin = candidate;
        await set(ref(db, "rooms/" + pin), {
          host: myId,
          state: "waiting",
          round: 0,
          createdAt: serverTimestamp(),
          players: { [myId]: myName }
        });
        enterRoom();
        return;
      }
    }
    lobbyMsg.textContent = "Could not find a free PIN. Try again.";
  } catch (error) {
    lobbyMsg.textContent = "Error: " + error.message;
  }
}

async function joinGame() {
  myName = nameInput.value.trim() || "Player";
  const code = pinInput.value.trim();
  if (code.length !== 4) {
    lobbyMsg.textContent = "Type the 4-digit PIN.";
    return;
  }
  lobbyMsg.textContent = "Joining...";
  try {
    const snap = await get(ref(db, "rooms/" + code));
    if (!snap.exists()) {
      lobbyMsg.textContent = "No game with that PIN.";
      return;
    }
    const data = snap.val();
    if (data.state !== "waiting") {
      lobbyMsg.textContent = "That game already started.";
      return;
    }
    if (Object.keys(data.players || {}).length >= MAX_PLAYERS) {
      lobbyMsg.textContent = "That game is full.";
      return;
    }
    pin = code;
    await set(ref(db, "rooms/" + pin + "/players/" + myId), myName);
    enterRoom();
  } catch (error) {
    lobbyMsg.textContent = "Error: " + error.message;
  }
}

function enterRoom() {
  lobbyBox.hidden = true;
  roomBox.hidden = false;
  pinShow.textContent = pin;
  onValue(ref(db, "rooms/" + pin), function (snapshot) {
    render(snapshot.val());
  });
}

function startFirstRound() {
  if (playerCount < 2) {
    roomMsg.textContent = "You need at least 2 players.";
    return;
  }
  update(ref(db, "rooms/" + pin), {
    state: "playing",
    round: 1,
    total: playerCount
  });
}

function nextRound() {
  set(ref(db, "rooms/" + pin + "/round"), currentRound + 1);
}

/* ---------- drawing the screen from the database ---------- */

function render(data) {
  if (data === null) {
    info.textContent = "This game was closed.";
    return;
  }
  isHost = data.host === myId;
  playerCount = Object.keys(data.players || {}).length;

  playerList.innerHTML = "";
  Object.values(data.players || {}).forEach(function (name) {
    const li = document.createElement("li");
    li.textContent = name;
    playerList.appendChild(li);
  });
  startBtn.hidden = !(isHost && data.state === "waiting");
  waitHost.hidden = isHost || data.state !== "waiting";

  if (data.state !== "playing") {
    return;
  }
  circles = data.total - 1;
  if (data.round !== currentRound) {
    beginRound(data.round);
  }
  latest = derive(data.taps, data.round, data.players);
  showProgress(latest);
}

function beginRound(round) {
  currentRound = round;
  overShown = false;
  latest = { next: 1, last: null, over: false, finished: false, losers: [], used: {}, leftover: "" };
  roomBox.hidden = true;
  gameBox.hidden = false;
  over.hidden = true;
  info.textContent = "Tap 1 first!";
  field.innerHTML = "";
  placed.length = 0;
  for (let n = 1; n <= circles; n++) {
    makeNumber(n);
  }
}

function showProgress(result) {
  for (let i = 0; i < result.next - 1; i++) {
    field.children[i].classList.add("done");
  }
  if (result.last) {
    info.textContent = result.last.name + " tapped " + result.last.n;
  }
  if (overShown) {
    return;
  }
  const dare = "Dare: " + DARES[(Number(pin) + currentRound) % DARES.length];
  if (result.over) {
    overShown = true;
    showOver(
      result.losers[0] + " and " + result.losers[1] + " tapped together! 눈치 없어!",
      dare
    );
  } else if (result.finished) {
    overShown = true;
    showOver(result.leftover + " was left alone! 눈치 없어!", dare);
  }
}

function showOver(message, dare) {
  msg.textContent = message;
  dareText.textContent = dare;
  again.hidden = !isHost;
  waitNext.hidden = isHost;
  over.hidden = false;
}

/* ---------- the rules, worked out from the list of taps ---------- */

function derive(tapsObj, round, players) {
  const list = [];
  Object.keys(tapsObj || {}).forEach(function (key) {
    const t = tapsObj[key];
    if (t.round === round) {
      list.push({ key: key, n: t.n, who: t.who, name: t.name, t: t.t });
    }
  });
  list.sort(function (a, b) {
    if (a.t !== b.t) {
      return a.t - b.t;
    }
    return a.key < b.key ? -1 : 1;
  });

  let next = 1;
  let last = null;
  let isOver = false;
  let losers = [];
  const used = {};
  for (let i = 0; i < list.length; i++) {
    const tap = list[i];
    if (last && tap.n === last.n && tap.who !== last.who && tap.t - last.t < CLASH_MS) {
      isOver = true;
      losers = [last.name, tap.name];
      break;
    }
    if (tap.n === next && !used[tap.who]) {
      last = tap;
      used[tap.who] = true;
      next = next + 1;
    }
  }
  const finished = !isOver && next > circles;
  let leftover = "";
  if (finished) {
    Object.keys(players || {}).forEach(function (id) {
      if (!used[id]) {
        leftover = players[id];
      }
    });
  }
  return {
    next: next,
    last: last,
    over: isOver,
    finished: finished,
    losers: losers,
    used: used,
    leftover: leftover
  };
}

/* ---------- tapping ---------- */

function tapNumber(n) {
  if (latest.over || latest.finished) {
    return;
  }
  if (n !== latest.next) {
    return;
  }
  if (latest.used[myId]) {
    info.textContent = "You already tapped. Wait and watch!";
    return;
  }
  push(ref(db, "rooms/" + pin + "/taps"), {
    round: currentRound,
    n: n,
    who: myId,
    name: myName,
    t: serverTimestamp()
  }).catch(function (error) {
    info.textContent = "Error: " + error.message;
  });
}

function findSpot(size) {
  for (let tries = 0; tries < 300; tries++) {
    const x = Math.random() * (window.innerWidth - size);
    const y = 120 + Math.random() * (window.innerHeight - size - 120);
    let ok = true;
    placed.forEach(function (p) {
      const dx = (x + size / 2) - (p.x + p.size / 2);
      const dy = (y + size / 2) - (p.y + p.size / 2);
      const distance = Math.sqrt(dx * dx + dy * dy);
      if (distance < (size + p.size) / 2 + 8) {
        ok = false;
      }
    });
    if (ok) {
      return { x: x, y: y };
    }
  }
  return null;
}

function makeNumber(n) {
  let size = 45 + Math.random() * 40;
  let spot = findSpot(size);
  while (spot === null && size > 20) {
    size = size * 0.9;
    spot = findSpot(size);
  }
  if (spot === null) {
    spot = { x: 0, y: 120 };
  }
  placed.push({ x: spot.x, y: spot.y, size: size });

  const el = document.createElement("div");
  el.className = "num";
  el.textContent = n;
  el.style.width = size + "px";
  el.style.height = size + "px";
  el.style.left = spot.x + "px";
  el.style.top = spot.y + "px";
  el.addEventListener("click", function () {
    tapNumber(n);
  });
  field.appendChild(el);
}

/* ---------- buttons ---------- */

$("newBtn").addEventListener("click", newGame);
$("joinBtn").addEventListener("click", joinGame);
startBtn.addEventListener("click", startFirstRound);
again.addEventListener("click", nextRound);

lobbyMsg.textContent = "";

  </script>
</body>
</html>
